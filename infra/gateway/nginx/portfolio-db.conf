# PostgreSQL is not HTTP. Include this whole file at the top level of
# /etc/nginx/nginx.conf, outside the `http {}` block.
#
# Replace FLY_DNS_IPV6 with the DNS address from flyio.conf. The square brackets
# are required because the resolver address is IPv6.
stream {
    resolver [FLY_DNS_IPV6] valid=10s ipv4=off ipv6=on;

    server {
        # node-postgres connects with sslnegotiation=direct, so Nginx can terminate
        # TLS before forwarding the PostgreSQL startup message through WireGuard.
        listen 6432 ssl;
        listen [::]:6432 ssl;

        ssl_certificate /etc/letsencrypt/live/db-gateway.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/db-gateway.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_alpn postgresql;
        ssl_session_cache shared:portfolio_db_tls:10m;
        ssl_session_timeout 10m;

        # A variable makes Nginx resolve Fly's dynamic .internal AAAA record again
        # after the resolver TTL. The upstream hop is protected by WireGuard.
        set $fly_database "portfolio-poncosh.internal:5432";
        proxy_pass $fly_database;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_socket_keepalive on;

        # When Vercel Static IPs are enabled, put `allow` entries here and finish
        # with `deny all`. Keep the port closed at the firewall until the real IPs
        # have replaced these examples.
        # allow 192.0.2.10;
        # allow 192.0.2.11;
        # deny all;
    }
}
